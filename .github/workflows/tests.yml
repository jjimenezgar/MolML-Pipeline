name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -q
      - name: Download official MoleculeNet BACE dataset
        run: |
          curl --fail --location --retry 3             https://deepchemdata.s3-us-west-1.amazonaws.com/datasets/bace.csv             --output data/raw/bace.csv
      - name: Validate four real BACE configurations
        run: |
          for config in configs/*.yaml; do
            python -m molml.train --config "$config" > /dev/null
          done
      - name: Validate V1.1 domain on real BACE
        run: python -m molml.v11 --config configs/rf_scaffold.yaml --output /tmp/molml-v11 > /dev/null
