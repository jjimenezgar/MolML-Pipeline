name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            constraints: ""
          - python-version: "3.11"
            constraints: ""
          - python-version: "3.12"
            constraints: "-c requirements-benchmark.txt"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install ${{ matrix.constraints }} -e ".[dev,explain,tracking,api]"
      - name: Run unit tests
        run: pytest -q
      - name: Download official MoleculeNet BACE dataset
        run: |
          curl --fail --location --retry 3 \
            https://deepchemdata.s3-us-west-1.amazonaws.com/datasets/bace.csv \
            --output data/raw/bace.csv
      - name: Validate four real BACE configurations
        run: |
          for config in configs/*.yaml; do
            python -m molml.train --config "$config" > /dev/null
          done
      - name: Validate V1.1 domain on real BACE
        run: python -m molml.v11 --config configs/rf_scaffold.yaml --output /tmp/molml-v11 --mlflow-uri sqlite:////tmp/molml-ci.db > /dev/null
      - name: Validate V1.2 additivity on real BACE
        run: |
          python -m molml.explain --config configs/lr_scaffold.yaml --output /tmp/molml-v12-lr > /dev/null
          python -m molml.explain --config configs/rf_scaffold.yaml --output /tmp/molml-v12-rf > /dev/null
      - name: Validate V3 saved-model inference on real BACE
        run: |
          python -m molml.train --config configs/rf_scaffold.yaml \
            --output /tmp/molml-v3/train \
            --save-model /tmp/molml-v3/model.joblib > /dev/null
          printf 'smiles,name\nCCO,ethanol\nnot-a-smiles,invalid\n' > /tmp/molml-v3-input.csv
          python -m molml.predict --model /tmp/molml-v3/model.joblib \
            --input /tmp/molml-v3-input.csv --output /tmp/molml-v3-output.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          rows = list(csv.DictReader(Path('/tmp/molml-v3-output.csv').open()))
          assert len(rows) == 2
          assert rows[0]['status'] == 'ok' and rows[0]['prediction'] in {'0', '1'}
          assert rows[0]['probability_class_1']
          assert rows[1]['status'] == 'invalid' and rows[1]['error']
          PY
      - name: Validate V4 HTTP API with the trained BACE model
        run: |
          MOLML_MODEL_PATH=/tmp/molml-v3/model.joblib molml-api > /tmp/molml-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/molml-health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health > /tmp/molml-health.json
          curl --fail --silent --request POST \
            --header 'Content-Type: application/json' \
            --data '{"smiles":["CCO","not-a-smiles"]}' \
            http://127.0.0.1:8000/predict > /tmp/molml-api-predictions.json
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('/tmp/molml-health.json').read_text())
          rows = json.loads(Path('/tmp/molml-api-predictions.json').read_text())['predictions']
          assert health['status'] == 'ok' and health['model_ready'] is True
          assert rows[0]['status'] == 'ok' and rows[0]['prediction'] in (0, 1)
          assert rows[1]['status'] == 'invalid' and rows[1]['error']
          PY
