[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molml-pipeline"
version = "1.5.0"
description = "Reproducible molecular ML benchmark for bioactivity classification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "rdkit>=2023.9",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
tracking = ["mlflow>=2.18,<5"]
explain = ["shap>=0.46,<1"]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "httpx>=0.27"]

[project.scripts]
molml-predict = "molml.predict:main"
molml-api = "molml.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
